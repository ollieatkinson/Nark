name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0
        required: true
        type: string
      draft:
        description: Create a draft release for review
        default: true
        type: boolean
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nark-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    if: github.ref == 'refs/heads/trunk'
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.19

      - name: Check release inputs and credentials
        id: version
        env:
          VERSION: ${{ inputs.version }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          FILTER_PROFILE_BASE64: ${{ secrets.FILTER_PROFILE_BASE64 }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: mise run release:check

      - name: Approve reviewed package versions
        run: mise run release:trust

      - name: Check release tasks
        run: mise run release:test

      - name: Test
        run: mise run test --jobs 2

      - name: Import Developer ID signing assets
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          FILTER_PROFILE_BASE64: ${{ secrets.FILTER_PROFILE_BASE64 }}
        run: mise run release:sign

      - name: Archive the universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          FILTER_PROFILE: ${{ steps.signing.outputs.filter_profile }}
        run: mise run release:archive

      - name: Verify signatures and release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: mise run release:verify

      - name: Notarize and staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: mise run release:notarize

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-release
          path: ${{ runner.temp }}/nark-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: mise run release:clean

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.19

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-release
          path: ${{ runner.temp }}/nark-release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ needs.package.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: mise run release:publish
