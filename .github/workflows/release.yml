name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0
        required: true
        type: string
      draft:
        description: Create a draft release for review
        default: true
        type: boolean
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nark-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    if: github.ref == 'refs/heads/trunk'
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release inputs and credentials
        id: version
        env:
          VERSION: ${{ inputs.version }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          FILTER_PROFILE_BASE64: ${{ secrets.FILTER_PROFILE_BASE64 }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "SIGNING_DIRECTORY=$RUNNER_TEMP/nark-signing" >> "$GITHUB_ENV"
          echo "RELEASE_DIRECTORY=$RUNNER_TEMP/nark-release" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("Version must be three numbers, for example 0.1.0, without a v prefix.")
          required = [
              "APPLE_TEAM_ID", "DEVELOPER_ID_P12_BASE64", "DEVELOPER_ID_P12_PASSWORD",
              "APP_PROFILE_BASE64", "FILTER_PROFILE_BASE64", "NOTARY_KEY_BASE64",
              "NOTARY_KEY_ID", "NOTARY_ISSUER_ID",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure the release environment first: " + ", ".join(missing))
          if not re.fullmatch(r"[A-Z0-9]{10}", os.environ["APPLE_TEAM_ID"]):
              raise SystemExit("APPLE_TEAM_ID must be a ten-character Apple Developer team ID.")
          settings = pathlib.Path("Configuration/Project.xcconfig").read_text()
          base = int(re.search(r"^CURRENT_PROJECT_VERSION = (\d+)$", settings, re.M)[1])
          counter = base + int(os.environ["GITHUB_RUN_NUMBER"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          if not (1 <= counter <= 9999 and 1 <= attempt <= 99):
              raise SystemExit("Build number exceeds CFBundleVersion component limits.")
          build = f"{counter}.{attempt}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\nbuild={build}\n")
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}"; then
            echo "::error::This version already has a tag. Choose a new version."
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          xcodebuild -version

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.19

      - name: Approve reviewed package versions
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil

          pins = {pin["identity"]: pin["state"]["revision"]
                  for pin in json.loads(pathlib.Path("Package.resolved").read_text())["pins"]}
          destination = pathlib.Path.home() / "Library/org.swift.swiftpm/security"
          destination.mkdir(parents=True, exist_ok=True)
          for name in ("macros", "plugins"):
              source = pathlib.Path(".github/package-trust") / f"{name}.json"
              for approval in json.loads(source.read_text()):
                  if pins.get(approval["packageIdentity"]) != approval["fingerprint"]:
                      raise SystemExit(f"Review the updated package before approving {approval['targetName']}.")
              shutil.copyfile(source, destination / source.name)
          PY

      - name: Test
        run: mise run test --jobs 2

      - name: Import Developer ID signing assets
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          FILTER_PROFILE_BASE64: ${{ secrets.FILTER_PROFILE_BASE64 }}
        run: |
          umask 077
          mkdir -p "$SIGNING_DIRECTORY"
          KEYCHAIN="$SIGNING_DIRECTORY/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN KEYCHAIN_PASSWORD
          python3 - <<'PY'
          import base64, datetime, fnmatch, hashlib, json, os, pathlib, plistlib, re, shlex, shutil, subprocess

          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nark-signing"
          keychain = os.environ["KEYCHAIN"]
          password = os.environ["KEYCHAIN_PASSWORD"]
          team = os.environ["APPLE_TEAM_ID"]
          certificate = directory / "certificate.p12"
          def decode(name):
              return base64.b64decode("".join(os.environ[name].split()), validate=True)
          certificate.write_bytes(decode("DEVELOPER_ID_P12_BASE64"))
          subprocess.run(["security", "create-keychain", "-p", password, keychain], check=True)
          subprocess.run(["security", "set-keychain-settings", "-lut", "21600", keychain], check=True)
          subprocess.run(["security", "unlock-keychain", "-p", password, keychain], check=True)
          subprocess.run(["security", "import", str(certificate), "-k", keychain,
                          "-P", os.environ["DEVELOPER_ID_P12_PASSWORD"],
                          "-T", "/usr/bin/codesign", "-T", "/usr/bin/security"], check=True)
          certificate.unlink()
          subprocess.run(["security", "set-key-partition-list", "-S", "apple-tool:,apple:,codesign:",
                          "-s", "-k", password, keychain], check=True, stdout=subprocess.DEVNULL)
          search = shlex.split(subprocess.check_output(["security", "list-keychains", "-d", "user"], text=True))
          (directory / "keychain-search.json").write_text(json.dumps(search))
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", keychain, *search], check=True)
          identities = subprocess.check_output(["security", "find-identity", "-v", "-p", "codesigning", keychain], text=True)
          matches = re.findall(r'([A-F0-9]{40}) "Developer ID Application: [^"\n]+"', identities)
          if len(matches) != 1:
              raise SystemExit("The P12 must contain one valid Developer ID Application identity.")
          identity = matches[0]
          profiles = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          profiles.mkdir(parents=True, exist_ok=True)
          for variable, identifier, output_name in [
              ("APP_PROFILE_BASE64", "com.ollieatkinson.Nark", "app_profile"),
              ("FILTER_PROFILE_BASE64", "com.ollieatkinson.Nark.Filter", "filter_profile"),
          ]:
              source = directory / f"{output_name}.provisionprofile"
              source.write_bytes(decode(variable))
              profile = plistlib.loads(subprocess.check_output(["security", "cms", "-D", "-i", str(source)]))
              entitlements = profile["Entitlements"]
              app_id = entitlements.get("com.apple.application-identifier", entitlements.get("application-identifier"))
              if profile["TeamIdentifier"] != [team] or app_id != f"{team}.{identifier}":
                  raise SystemExit(f"Wrong team or app identifier in {output_name}.")
              if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
                  raise SystemExit(f"The {output_name} has expired.")
              if profile.get("ProvisionedDevices") or any(entitlements.get(key) for key in ("get-task-allow", "com.apple.security.get-task-allow")):
                  raise SystemExit(f"Use a Developer ID distribution profile for {output_name}, not a development profile.")
              if identity not in [hashlib.sha1(cert).hexdigest().upper() for cert in profile["DeveloperCertificates"]]:
                  raise SystemExit(f"The {output_name} does not authorize the imported certificate.")
              if "content-filter-provider-systemextension" not in entitlements.get("com.apple.developer.networking.networkextension", []):
                  raise SystemExit(f"The {output_name} needs the Developer ID content-filter system-extension entitlement.")
              if not any(fnmatch.fnmatchcase("group.com.ollieatkinson.Nark", group)
                         for group in entitlements.get("com.apple.security.application-groups", [])):
                  raise SystemExit(f"The {output_name} does not authorize Nark's app group.")
              if output_name == "app_profile" and not entitlements.get("com.apple.developer.system-extension.install"):
                  raise SystemExit("The app profile needs the System Extension capability.")
              uuid = profile["UUID"]
              if not re.fullmatch(r"[A-Fa-f0-9-]{36}", uuid):
                  raise SystemExit("Invalid provisioning profile UUID.")
              shutil.copyfile(source, profiles / f"{uuid}.provisionprofile")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"{output_name}={uuid}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"identity={identity}\n")
          PY

      - name: Archive the universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          FILTER_PROFILE: ${{ steps.signing.outputs.filter_profile }}
        run: |
          xcodebuild -project Nark.xcodeproj -scheme Nark -configuration Release -jobs 2 \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Nark.xcarchive" \
            -xcconfig Configuration/Distribution.xcconfig \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            NARK_APP_PROVISIONING_PROFILE="$APP_PROFILE" NARK_FILTER_PROVISIONING_PROFILE="$FILTER_PROFILE" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO archive

      - name: Verify signatures and release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          APP="$RUNNER_TEMP/Nark.xcarchive/Products/Applications/Nark.app"
          codesign --verify --deep --strict "$APP"
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess

          app = pathlib.Path(os.environ["RUNNER_TEMP"]) / "Nark.xcarchive/Products/Applications/Nark.app"
          extension = app / "Contents/Library/SystemExtensions/com.ollieatkinson.Nark.Filter.systemextension"
          for bundle, executable, identifier in [
              (app, "nark", "com.ollieatkinson.Nark"),
              (extension, "NarkFilter", "com.ollieatkinson.Nark.Filter"),
          ]:
              info = plistlib.loads((bundle / "Contents/Info.plist").read_bytes())
              assert info["CFBundleIdentifier"] == identifier
              assert info["CFBundleShortVersionString"] == os.environ["VERSION"]
              assert info["CFBundleVersion"] == os.environ["BUILD"]
              service = info.get("NetworkExtension", {}).get("NEMachServiceName") or info.get("NarkMachService")
              assert service == "group.com.ollieatkinson.Nark.filter.v" + os.environ["BUILD"]
              entitlements = plistlib.loads(subprocess.check_output(["codesign", "-d", "--entitlements", ":-", str(bundle)], stderr=subprocess.DEVNULL))
              assert not any(entitlements.get(key) for key in ("get-task-allow", "com.apple.security.get-task-allow"))
              assert entitlements["com.apple.developer.team-identifier"] == os.environ["APPLE_TEAM_ID"]
              assert "group.com.ollieatkinson.Nark" in entitlements["com.apple.security.application-groups"]
              assert "content-filter-provider-systemextension" in entitlements["com.apple.developer.networking.networkextension"]
              if bundle == app:
                  assert entitlements["com.apple.developer.system-extension.install"]
              details = subprocess.run(["codesign", "-dv", "--verbose=4", str(bundle)], capture_output=True, text=True, check=True).stderr
              assert "Authority=Developer ID Application:" in details
              assert "TeamIdentifier=" + os.environ["APPLE_TEAM_ID"] in details
              assert "(runtime)" in details and "Timestamp=" in details
              architectures = subprocess.check_output(["lipo", "-archs", str(bundle / "Contents/MacOS" / executable)], text=True).split()
              assert set(architectures) == {"arm64", "x86_64"}
          PY

      - name: Notarize and staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          umask 077
          APP="$RUNNER_TEMP/Nark.xcarchive/Products/Applications/Nark.app"
          python3 - <<'PY'
          import base64, os, pathlib
          key = pathlib.Path(os.environ["SIGNING_DIRECTORY"]) / "notary.p8"
          key.write_bytes(base64.b64decode("".join(os.environ["NOTARY_KEY_BASE64"].split()), validate=True))
          PY
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarization.zip"
          auth=(--key "$SIGNING_DIRECTORY/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          if xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" "${auth[@]}" \
              --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notarization.json"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "Accepted"' "$RUNNER_TEMP/notarization.json"
          else
            submission=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notarization.json" 2>/dev/null || true)
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${auth[@]}" "$RUNNER_TEMP/notarization-log.json"
              cat "$RUNNER_TEMP/notarization-log.json"
            fi
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          mkdir -p "$RELEASE_DIRECTORY"
          ditto -c -k --keepParent "$APP" "$RELEASE_DIRECTORY/Nark-${VERSION}-macOS.zip"
          cd "$RELEASE_DIRECTORY"
          shasum -a 256 "Nark-${VERSION}-macOS.zip" > "Nark-${VERSION}-macOS.zip.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-release
          path: ${{ runner.temp }}/nark-release/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib, re, shutil, subprocess

          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nark-signing"
          try:
              search = directory / "keychain-search.json"
              if search.exists():
                  subprocess.run(["security", "list-keychains", "-d", "user", "-s", *json.loads(search.read_text())], check=True)
              keychain = directory / "release.keychain-db"
              if keychain.exists():
                  subprocess.run(["security", "delete-keychain", str(keychain)], check=True)
              profiles = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
              for source in directory.glob("*.provisionprofile"):
                  result = subprocess.run(["security", "cms", "-D", "-i", str(source)], capture_output=True)
                  if result.returncode == 0:
                      uuid = plistlib.loads(result.stdout).get("UUID")
                      if isinstance(uuid, str) and re.fullmatch(r"[A-Fa-f0-9-]{36}", uuid):
                          (profiles / f"{uuid}.provisionprofile").unlink(missing_ok=True)
          finally:
              shutil.rmtree(directory, ignore_errors=True)
          PY

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notarized-release
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ needs.package.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        working-directory: release
        run: |
          sha256sum -c "Nark-${VERSION}-macOS.zip.sha256"
          gh release create "$TAG" "Nark-${VERSION}-macOS.zip" "Nark-${VERSION}-macOS.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Nark ${VERSION}" \
            --generate-notes --draft="$DRAFT" --prerelease="$PRERELEASE"
